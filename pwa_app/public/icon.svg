<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="#1a1a2e"/>
  <g transform="translate(40, 40)">
    <!-- Piano keys -->
    <rect x="10" y="20" width="15" height="80" fill="white" rx="2"/>
    <rect x="30" y="20" width="15" height="80" fill="white" rx="2"/>
    <rect x="50" y="20" width="15" height="80" fill="white" rx="2"/>
    <rect x="70" y="20" width="15" height="80" fill="white" rx="2"/>
    <rect x="90" y="20" width="15" height="80" fill="white" rx="2"/>
    <rect x="110" y="20" width="15" height="80" fill="white" rx="2"/>
    
    <!-- Black keys -->
    <rect x="20" y="20" width="10" height="50" fill="#222" rx="1"/>
    <rect x="40" y="20" width="10" height="50" fill="#222" rx="1"/>
    <rect x="80" y="20" width="10" height="50" fill="#222" rx="1"/>
    <rect x="100" y="20" width="10" height="50" fill="#222" rx="1"/>
    
    <!-- Waveform -->
    <path d="M10,110 Q30,95 50,110 T90,110 T130,110" 
          stroke="url(#grad)" 
          stroke-width="3" 
          fill="none" 
          stroke-linecap="round"/>
  </g>
</svg>
